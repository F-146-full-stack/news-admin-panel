<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Login Page</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 px-4">

    <div
        class="w-full max-w-md bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl shadow-2xl p-8 text-white">

        <h1 class="text-4xl font-bold text-center mb-2">
            Welcome Back
        </h1>

        <p class="text-center text-slate-300 mb-8">
            Sign in admin panel
        </p>

        <form id="loginForm" class="space-y-5">

            <div>
                <label class="block mb-2 text-sm text-slate-200">
                    Email Address
                </label>
                <input type="email" required placeholder="example@gmail.com"
                    class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-slate-400 outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/30 transition">
            </div>

            <div>
                <label class="block mb-2 text-sm text-slate-200">
                    Password
                </label>
                <input required minlength="6" type="password" placeholder="••••••••"
                    class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-slate-400 outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/30 transition">
            </div>
            <button id="btn" type="submit"
                class="w-full py-3 rounded-xl bg-cyan-500 hover:bg-cyan-400 transition font-semibold text-slate-900 shadow-lg shadow-cyan-500/20">
                Login
            </button>

        </form>
    </div>

    <div id="toast">
        
    </div>

    <script src="scripts/service.js"></script>
    <script src="scripts/auth.js"></script>
</body>

</html>
