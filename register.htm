<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

        <h2 class="text-2xl font-bold text-center text-gray-800">
            Create Account
        </h2>

        <p class="text-center text-gray-500 text-sm mt-1">
            Fill the form to register
        </p>

        <form id="registerForm" class="mt-6 space-y-4">

            <!-- Photo URL -->
            <div>
                <label class="text-sm text-gray-600">Photo URL</label>
                <input required type="file" onchange="uploadImage(this)" name="photoUrl" placeholder="https://..."
                    class="w-full mt-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-black" />
            </div>

            <!-- Full Name -->
            <div>
                <label class="text-sm text-gray-600">Full Name</label>
                <input required type="text" name="fullName" placeholder="John Doe"
                    class="w-full mt-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-black" />
            </div>

            <!-- Username -->
            <div>
                <label class="text-sm text-gray-600">Username</label>
                <input required type="text" name="username" placeholder="johndoe"
                    class="w-full mt-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-black" />
            </div>

            <!-- Email -->
            <div>
                <label class="text-sm text-gray-600">Email</label>
                <input required type="email" name="email" placeholder="example@gmail.com"
                    class="w-full mt-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-black" />
            </div>

            <!-- Password -->
            <div>
                <label class="text-sm text-gray-600">Password</label>
                <input required type="password" name="password" placeholder="••••••••"
                    class="w-full mt-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-black" />
            </div>

            <!-- Gender -->
            <div>
                <label class="text-sm text-gray-600">Gender</label>
                <select required name="gender"
                    class="w-full mt-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                    <option disabled selected value="">Select gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>

            <!-- Button -->
            <button id="registerBtn" type="submit"
                class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800 transition">
                Register
            </button>
        </form>
    </div>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script src="scripts/service.js"></script>
    <script src="scripts/user/register.js"></script>
</body>

</html>
